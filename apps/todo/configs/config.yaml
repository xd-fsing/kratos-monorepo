server:
  http:
    addr: 0.0.0.0:8000
    timeout: 1s
  grpc:
    addr: 0.0.0.0:9000
    timeout: 1s
data:
  database:
    driver: mysql
    # 每个服务独立的数据库与环境变量：各服务持有自己的存储，一个环境变量
    # 不可能把两个服务翻到同一个库上。
    source: ${TODO_DATABASE_SOURCE:root:root@tcp(127.0.0.1:3306)/test_todo?timeout=5s&parseTime=True&loc=Local&charset=utf8mb4}
    # 开发便利项。生产环境两者都保持 false，并把 schema 变更作为单独评审的
    # 步骤执行。
    debug: true
    auto_migrate: true
  redis:
    addr: ${REDIS_ADDR:127.0.0.1:6379}
    read_timeout: 0.2s
    write_timeout: 0.2s
client:
  # 本服务调用的 user 服务的 gRPC 地址。本地开发用直连地址；接入注册中心后
  # 可换成 discovery:///user。
  addr: 127.0.0.1:9001
  timeout: 1s
