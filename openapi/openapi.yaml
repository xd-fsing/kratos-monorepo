components:
    schemas:
        todo.v1.SyncTodoRequest:
            type: object
            properties:
                action:
                    type: string
                    description: 要执行的操作，取值 `create`、`update` 或 `delete`。
                todo:
                    allOf:
                        - $ref: '#/components/schemas/todo.v1.Todo'
                    description: '`create` 与 `update` 操作的载荷；`delete` 时被忽略。'
                id:
                    type: string
                    description: 目标 todo 的标识。`delete` 与 `update` 必填。
                updateMask:
                    type: string
                    description: |-
                        `update` 操作用于限定覆盖范围的字段掩码。
                         `create` 与 `delete` 时被忽略。
                    format: field-mask
            description: |-
                SyncTodoRequest 是 SyncTodos 双向流中的单条客户端消息。
                 action 字段决定在服务端执行哪个操作。
        todo.v1.Todo:
            type: object
            properties:
                id:
                    type: string
                    description: 应用侧生成的 UUIDv7 标识。创建时只读。
                title:
                    type: string
                    description: 简短的人类可读标题。
                content:
                    type: string
                    description: 事项的详细描述或备注。
                completed:
                    type: boolean
                    description: 事项是否已完成。
                createdAt:
                    type: string
                    description: 事项的创建时间。服务端分配，只读。
                    format: date-time
                updatedAt:
                    type: string
                    description: 事项的最后修改时间。服务端分配，只读。
                    format: date-time
                status:
                    type: integer
                    description: |-
                        生命周期状态。服务端分配，只读：调用 DeleteTodo 把事项移到
                         TODO_STATUS_DELETED。
                    format: enum
                userId:
                    type: string
                    description: |-
                        归属用户的 id，由 user 服务持有。可选。CreateTodo 时服务端会通过
                         user 服务的 API 校验用户存在（不存在则 NOT_FOUND）。创建后只读：
                         UpdateTodo 会忽略它。空字符串表示无归属。
            description: Todo 是 todo 事项的规范表示。
        todo.v1.TodoEvent:
            type: object
            properties:
                action:
                    type: string
                    description: 发生的变更，取值 `created`、`updated` 或 `deleted`。
                todo:
                    allOf:
                        - $ref: '#/components/schemas/todo.v1.Todo'
                    description: 变更后的 todo。对 `deleted` 事件，只保证 id 字段有值。
                eventTime:
                    type: string
                    description: 服务端观察到变更的时间。
                    format: date-time
            description: |-
                TodoEvent 是服务端推送的描述 todo 变更的消息。
                 由 WatchTodos 与 SyncTodos 两条流共同使用。
        todo.v1.TodoSet:
            type: object
            properties:
                todos:
                    type: array
                    items:
                        $ref: '#/components/schemas/todo.v1.Todo'
                    description: 按 ListTodosRequest.order_by 指定顺序排列的一页 todo。
                nextPageToken:
                    type: string
                    description: |-
                        用于通过 ListTodosRequest.page_token 获取下一页的令牌。
                         没有更多结果时为空。
            description: TodoSet 是 ListTodos 返回的分页集合。
        user.v1.User:
            type: object
            properties:
                id:
                    type: string
                    description: 应用侧生成的 UUIDv7 标识。创建时只读。
                name:
                    type: string
                    description: 用户的显示名称。
                email:
                    type: string
                    description: 用户的邮箱地址。
                createdAt:
                    type: string
                    description: 用户的创建时间。服务端分配，只读。
                    format: date-time
                updatedAt:
                    type: string
                    description: 用户的最后修改时间。服务端分配，只读。
                    format: date-time
            description: User 是用户账号的规范表示。
        user.v1.UserSet:
            type: object
            properties:
                users:
                    type: array
                    items:
                        $ref: '#/components/schemas/user.v1.User'
                    description: 按 ListUsersRequest.order_by 指定顺序排列的一页用户。
                nextPageToken:
                    type: string
                    description: |-
                        用于通过 ListUsersRequest.page_token 获取下一页的令牌。
                         没有更多结果时为空。
            description: UserSet 是 ListUsers 返回的分页集合。
tags:
    - name: TodoService
      description: |-
        TodoService 提供管理 todo 事项的简单 CRUD 示例。
         它演示一元、服务端流式与双向流式 RPC，以及 AIP 风格的列表过滤、
         排序与分页。
    - name: UserService
      description: |-
        UserService 管理用户账号。它是本仓中用户的归属服务；其他服务通过它的
         gRPC API 按 id 引用用户，而不是直接访问它的数据库。
